<!doctype html>
<!-- Desktop preview of the pill against the live BeyondATC socket. Open in a browser:
     python -m http.server -d . 8765, then http://localhost:8765/tools/harness.html
     Replay buttons feed captured messages through batcPill.feed(). Add ?fake to run without BeyondATC: a
     stand-in socket records what the pill sends (batcPill.sent). -->
<meta charset="utf-8">
<title>BATC pill harness</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
  body { background: linear-gradient(180deg, #5d84b3 0%, #8fb0d3 45%, #a5a998 60%, #5d604f 100%); }
  .bar { position: absolute; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: 600 13px system-ui; border: 0; border-radius: 6px; padding: 8px 12px; background: #1a2129; color: #fff; cursor: pointer; }
</style>
<ui-resource-element name="MasterPage_InGame" id="host"></ui-resource-element>
<link rel="stylesheet" href="../src/html_ui/paul-batc-pill/pill.css">
<div class="bar">
  <button data-seq="wind">Replay wind check</button>
  <button data-seq="voice">Replay voice request</button>
  <button data-seq="ifr">Replay IFR clearance + readback</button>
  <button data-seq="rwy">Replay runway question</button>
  <button id="err">AppError</button>
  <button id="mute">Toggle COM1 mute</button>
  <button id="flight">Toggle in flight</button>
  <button id="ptt">Hold PTT</button>
</div>
<script>
  window.batcPillInlineCss = null;
  // Stand-in for the sim's `engine` key events: a held binding sends its event once, then every ~33 ms
  // after ~0.4 s, each one twice in the same ms (measured live with BAROMETRIC). Only what pill.js uses.
  window.engine = {
    handlers: {},
    on(name, fn) { (this.handlers[name] = this.handlers[name] || []).push(fn); },
    off(name, fn) { this.handlers[name] = (this.handlers[name] || []).filter(f => f !== fn); },
    trigger() {}, call() {},
    emit(name, ...args) { (this.handlers[name] || []).forEach(f => f(...args)); },
  };
  // pill.js would add its own <link>; the harness already has one with a path that resolves here
  // harness.html?fake: no BeyondATC needed; a stand-in socket that is open and records what the pill sends
  // (batcPill.sent), so the answers, requests and Tune can be clicked through with the replays
  if (/[?&]fake\b/.test(location.search)) {
    window.WebSocket = function () {
      this.readyState = 1;
      setTimeout(() => this.onopen && this.onopen(), 0);
    };
    window.WebSocket.prototype.send = function (m) { console.log("pill sent:", m); };
    window.WebSocket.prototype.close = function () {};
  }
</script>
<script src="../src/html_ui/paul-batc-pill/pill.js"></script>
<script>

           [4920, 'ATC: Wind 310 degrees, 8 knots.'], [4940, 'CommsState: {"mode":"speaking","text":"Speaking"}'],

            [7220, 'CommsState: {"mode":"ready","text":""}']],

    ifr: [[0, 'ATC: Airfrans 1234, Montpellier Ground, cleared to Marseille Provence via KELA8L departure, runway 12L, climb to FL060, squawk 1000.'],

          [5003, 'InfoBoxes: [{"title":"Taxi to Runway","info":"12L"},{"title":"SID","info":"KELA8L"},{"title":"Altitude Clearance","info":"FL060"},{"title":"Squawk","info":"1000"}]'],
          [5005, 'Actions: [Readback IFR Clearance¬Say Again¬]'],
          [10000, 'QueuedAction: Request IFR Clearance'], [10000, 'CommsState: {"mode":"queued","text":"Request IFR Clearance"}'],
          [10001, 'CommsState: {"mode":"ready","text":""}'], [10001, 'CommsState: {"mode":"awaiting","text":"Awaiting Response"}'],
          [10470, 'Player: Cleared to Marseille Provence via KELA8L departure, runway 12L, climb to FL060, squawk 1000, Airfrans 1234.'],
          [10500, 'CommsState: {"mode":"speaking","text":"Speaking"}'], [16000, 'CommsState: {"mode":"ready","text":""}'],
          [16002, 'Actions: [Readback IFR Clearance¬Say Again¬]'], [16030, 'CommsState: {"mode":"awaiting","text":"Awaiting Response"}'],

          [21003, 'Actions: [Acknowledge Instruction¬Say Again¬]'],

          [28800, 'ATC: Airfrans 1234, Montpellier Ground?'],
          [28820, 'CommsState: {"mode":"speaking","text":"Speaking"}'], [32400, 'CommsState: {"mode":"ready","text":""}'],
          [32403, 'Actions: [Acknowledge Instruction¬Say Again¬]'],
          [40000, 'Actions: [Request IFR Clearance¬Request Push and Start¬Request Startup Only¬Request Departure Runway Change¬Wind Check¬Radio Check¬]'], [40001, 'Actions: []'], [40004, 'Actions: [Request Push and Start¬Request Startup Only¬Request Departure Runway Change¬Wind Check¬Radio Check¬]']],

    rwy: [[0, 'Player: Airfrans 1234, request departure runway change.'], [20, 'CommsState: {"mode":"speaking","text":"Speaking"}'],
          [3500, 'CommsState: {"mode":"request","text":"Request Departure Runway Change"}'], [4700, 'CommsState: {"mode":"ready","text":""}'],
          [4710, 'CommsState: {"mode":"awaiting","text":"Awaiting Response"}'],
          [5400, 'ATC: Airfrans 1234, roger, say runway.'], [5420, 'CommsState: {"mode":"speaking","text":"Speaking"}'],
          [8400, 'CommsState: {"mode":"ready","text":""}'], [8403, 'Actions: [Cancel Runway Change¬Runway 12L¬Runway 12R¬Say Again¬]'],
          [13000, 'CommsState: {"mode":"queued","text":"Say Again"}'], [13001, 'CommsState: {"mode":"ready","text":""}'],
          [13001, 'CommsState: {"mode":"awaiting","text":"Awaiting Response"}'],
          [13300, 'Player: Request Runway 12L, Airfrans 1234.'], [13320, 'CommsState: {"mode":"speaking","text":"Speaking"}'],
          [16600, 'CommsState: {"mode":"ready","text":""}'], [16602, 'Actions: [Cancel Runway Change¬Runway 12L¬Runway 12R¬Say Again¬]'],
          [16660, 'CommsState: {"mode":"awaiting","text":"Awaiting Response"}'],
          [17700, "ATC: Airfrans 1234, 12L is the runway you're already assigned for departure. Unable runway change."],
          [17720, 'CommsState: {"mode":"speaking","text":"Speaking"}'], [25100, 'CommsState: {"mode":"ready","text":""}'],
          [25102, 'Actions: [Request Push and Start¬Request Startup Only¬Request Departure Runway Change¬Wind Check¬Radio Check¬]']],
  };
  document.querySelectorAll('[data-seq]').forEach(b => b.onclick = () => {
    batcPill.state.connected = true;
    SEQ[b.dataset.seq].forEach(([t, m]) => setTimeout(() => batcPill.feed(m), t));
  });
  err.onclick = () => batcPill.feed('AppError: Speech service unavailable');
  let muted = false;
  mute.onclick = () => batcPill.feed('RadioMute: ' + JSON.stringify({ com1: (muted = !muted), com2: false }));
  const hostEl = document.getElementById('host'); // window.host stops resolving once it's removed
  let pttTimers = [];
  ptt.onmousedown = () => {
    const send = () => { engine.emit('keyIntercepted', batcPill.config.pttEvent, 0, 0, 0); engine.emit('keyIntercepted', batcPill.config.pttEvent, 0, 0, 0); };
    send();
    pttTimers.push(setTimeout(() => pttTimers.push(setInterval(send, 33)), 400));
  };
  ptt.onmouseup = ptt.onmouseleave = () => { pttTimers.forEach(t => { clearTimeout(t); clearInterval(t); }); pttTimers = []; };
  flight.onclick = () => hostEl.isConnected ? hostEl.remove() : document.body.prepend(hostEl);
</script>
